name = "vishal-enterprises-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

account_id = "92080d83f64c1dca378ff1edfd4c326a"

# ---------------------------------------------------------------------------
# D1 — structured data (employers, workers, jobs, applications, etc.)
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "vishal_db"
database_id = "0a076b78-f04e-43bd-9a98-69617f1e569a"

# ---------------------------------------------------------------------------
# R2 — private files (resumes, certificates, company documents). This
# bucket is NOT public; files served only through authenticated Worker
# routes. Enabled on shruhood account.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "vishal-documents"

# ---------------------------------------------------------------------------
# Environment variables / secrets.
# Non-secret values go here; secrets are set with `wrangler secret put`
# and must never be committed (see .dev.vars.example).
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
# Comma-separated list of origins allowed to call the API. Production
# (https://vishal-enterprises-web.pages.dev) is always included.
ALLOWED_ORIGIN = "http://localhost:5173,https://vishal-enterprises-web.pages.dev"

# Secrets to configure via `wrangler secret put <NAME>`:
#   TURNSTILE_SECRET_KEY
#   SESSION_SIGNING_SECRET
#   ADMIN_INVITE_SECRET

[observability]
enabled = true
