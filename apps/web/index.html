<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EA6A12" />
    <title>Vishal Enterprises — Reliable Workforce Solutions for Industry</title>
    <meta
      name="description"
      content="Skilled, semi-skilled and unskilled manpower solutions backed by experienced management and continuous workforce support. Serving Daman, Vapi, Bhilad, Silvassa and nearby industrial areas."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Theme is applied before hydration to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ve-theme");
          var mode = stored || "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
